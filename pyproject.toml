[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-sentiment-trader"
version = "0.1.0"
description = "Research pipeline: score financial news with an LLM or lexicon, aggregate sentiment, test whether it leads price moves, and backtest a simple signal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aria Esmaeilzadeh" }]
keywords = ["sentiment", "nlp", "llm", "finance", "backtesting", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
nst = "news_sentiment_trader.cli:main"

[project.urls]
Homepage = "https://github.com/ariaesm/news-sentiment-trader"
Issues = "https://github.com/ariaesm/news-sentiment-trader/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
news_sentiment_trader = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
